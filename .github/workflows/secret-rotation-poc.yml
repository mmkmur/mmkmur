name: Secret Rotation POC

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to run'
        required: true
        default: 'check'
        type: choice
        options:
          - check
          - rotate

jobs:
  run:
    name: ${{ github.event.inputs.action == 'rotate' && 'Trigger Secret Rotation' || 'Check Secret Status' }}
    runs-on: ubuntu-latest

    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_KEYVAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}
      SECRET_NAME: ${{ secrets.SECRET_NAME }}
      ROTATION_INTERVAL_DAYS: ${{ secrets.ROTATION_INTERVAL_DAYS }}
      SECRET_REFRESH_INTERVAL_SECONDS: ${{ secrets.SECRET_REFRESH_INTERVAL_SECONDS }}
      FUNCTION_URL: ${{ secrets.FUNCTION_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: feature/secret-management-poc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r secret-management-poc/requirements.txt

      - name: Check secret status
        if: ${{ github.event.inputs.action == 'check' }}
        run: python secret-management-poc/scripts/check_status.py
        working-directory: secret-management-poc

      - name: Trigger secret rotation
        if: ${{ github.event.inputs.action == 'rotate' }}
        run: python secret-management-poc/scripts/simulate_near_expiry.py
        working-directory: secret-management-poc
